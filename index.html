  <script>
    /* Le manifeste (ajout à l'écran d'accueil) n'est déclaré qu'en ligne :
       ouvert par double-clic (file://), le navigateur refuserait de le lire. */
    if (location.protocol === 'https:' || location.protocol === 'http:') {
      var lienManifeste = document.createElement('link');
      lienManifeste.rel = 'manifest';
      lienManifeste.href = 'manifest.webmanifest';
      document.head.appendChild(lienManifeste);
    }
  </script>
