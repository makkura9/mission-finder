<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Questions à relire — Mission Finder</title>
<style>
  @page { size: A4; margin: 12mm 12mm 14mm; }
  body { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 8.3pt; line-height: 1.25; color: #111; margin: 0; }
  h1 { font-size: 14pt; margin: 0 0 2mm; }
  .intro { font-size: 8.5pt; color: #333; margin: 0 0 4mm; }
  #liste { column-count: 2; column-gap: 5mm; }
  .q { border: 1px solid #999; border-radius: 3px; padding: 2.5mm 3mm; margin-bottom: 3mm; break-inside: avoid; }
  .tete { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4mm; font-size: 8pt; color: #333; border-bottom: 1px solid #ddd; padding-bottom: 1mm; margin-bottom: 1.5mm; }
  .tete b { color: #0D6B73; }
  .enonce { font-weight: 700; font-size: 9.5pt; margin: 0 0 1.5mm; }
  ol { margin: 0 0 1.5mm; padding-left: 6mm; }
  li { margin: 0.4mm 0; }
  .ok { font-weight: 700; color: #1A7536; }
  .err { color: #555; font-size: 8pt; }
  .expl { margin: 0 0 1mm; }
  .src { font-size: 8pt; color: #444; }
  .cases { font-size: 8pt; margin-top: 1mm; color: #333; }
  .figure { margin: 1mm 0 2mm; max-width: 85mm; }
  .figure figcaption { font-size: 7pt; color: #555; }
  .fig-barre { display: block; border: 1px solid #ccc; }
  .fig-dock { display: flex; gap: 2px; padding: 4px; background: #D9DCE0; border-radius: 8px; max-width: 80mm; }
  .fig-dock-app { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .fig-dock-point { width: 4px; height: 4px; border-radius: 50%; margin: 2px 0; }
  .fig-dock-point.est-ouverte { background: #111; }
  .fig-dock-nom { font-size: 7pt; }
  .fig-fichier { display: flex; align-items: center; gap: 3mm; }
  .fig-fichier svg { width: 22px; height: 27px; }
  .fig-fichier-nom { font-family: "DejaVu Sans Mono", monospace; font-weight: 700; }
  .fig-finder, .fig-laterale { border: 1px solid #aaa; border-radius: 5px; overflow: hidden; font-size: 7.5pt; max-width: 85mm; }
  .fig-finder-barre { display: flex; gap: 6px; padding: 2px 5px; background: #eee; border-bottom: 1px solid #ccc; }
  .fig-feux { display: none; }
  .fig-colonnes { display: flex; }
  .fig-col { flex: 0 1 auto; max-width: 42%; min-width: 0; list-style: none; margin: 0; padding: 2px; border-right: 1px solid #ddd; }
  .fig-col:last-child { flex: 1 1 0; max-width: none; border-right: 0; }
  .fig-el { display: flex; align-items: flex-start; gap: 3px; padding: 0 3px; border-radius: 3px; }
  .fig-el svg { width: 10px; height: 10px; flex: none; margin-top: 1px; }
  .fig-el.est-choisi { background: #0A64D6; color: #fff; }
  .fig-el.est-parent { background: #ddd; }
  .fig-laterale { max-width: 45mm; padding: 2px 4px; background: #f3f3f3; }
  .fig-laterale ul { list-style: none; margin: 0; padding: 0; }
  .fig-section { margin: 2px 0 0; font-weight: 700; color: #666; font-size: 7pt; }
  h2 { font-size: 11pt; margin: 5mm 0 2mm; break-after: avoid; }
  table.relire { width: 100%; border-collapse: collapse; font-size: 8pt; margin-bottom: 3mm; }
  table.relire th, table.relire td { border: 1px solid #999; padding: 1mm 1.5mm; text-align: left; vertical-align: top; }
  table.relire th { background: #eee; }
  table.relire tr { break-inside: avoid; }
  .badge { font-weight: 700; padding: 0 1.5mm; border-radius: 2px; }
  .badge-nouvelle { background: #FCE8E6; color: #8A1C14; }
  .badge-validee { background: #E6F4EA; color: #1A7536; }
  .commandes { margin: 0 0 4mm; font-size: 9pt; }
  .commandes button { font: inherit; padding: 1mm 3mm; }
  @media print { .commandes { display: none; } }
</style>
</head>
<body>
<h1>Mission Finder — questions à relire</h1>
<p class="intro" id="intro"></p>
<p class="commandes"><label><input type="checkbox" id="voir-validees"> Afficher aussi les questions déjà validées (phase 2)</label></p>
<div id="liste"></div>
<div id="phase4"></div>
<div id="phase5"></div>
<div id="phase6"></div>
<div id="phase7"></div>
<script src="../data/objectifs.js"></script>
<script src="../data/questions.js"></script>
<script src="../data/raccourcis.js"></script>
<script src="../data/bureau.js"></script>
<script src="../data/missions-finder.js"></script>
<script src="../data/libelles-macos.js"></script>
<script src="../data/fichiers-virtuels.js"></script>
<script src="../js/recherche-modele.js"></script>
<script src="../data/badges.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/figures.js"></script>
<script>
  const esc = MF.ui.esc;
  const TYPES = { unique: 'Choix unique', multiple: 'Choix multiple', vraifaux: 'Vrai ou faux', ranger: 'Où ranger ?' };
  // Questions relues et validées par l'enseignant (phases 2 et 3, 30.09.2026).
  const VALIDEES = [
    'bur-01', 'bur-02', 'bur-03', 'bur-04', 'bur-05', 'bur-06', 'bur-07', 'bur-08', 'bur-09', 'bur-10',
    'bur-11', 'fin-01', 'fin-02', 'fin-03', 'fin-04', 'fin-05', 'fin-06', 'fin-07', 'fin-08', 'fin-09',
    'fin-10', 'fin-11', 'fin-12', 'fin-13', 'fin-14', 'fin-15', 'fin-16', 'fin-17', 'fin-18', 'fin-19',
    'fin-20', 'fin-21', 'fin-22', 'fin-23', 'fin-24', 'fin-25', 'fin-26', 'typ-01', 'typ-02', 'typ-03',
    'typ-04', 'typ-05', 'typ-06', 'typ-07', 'typ-08', 'typ-09', 'typ-10', 'typ-11', 'typ-12', 'typ-13',
    'typ-14', 'typ-15', 'typ-16', 'rac-01', 'rac-02', 'rac-03', 'rac-04', 'rac-05', 'rac-06', 'rac-07',
    'rac-08', 'rac-09', 'rac-10', 'rac-11', 'rac-12', 'rac-13', 'rac-14', 'rac-15', 'rac-16', 'rac-17',
    'rac-18', 'rac-19', 'rac-20', 'rec-01', 'rec-02', 'rec-03', 'rec-04', 'rec-05', 'rec-06', 'rec-07',
    'rec-08', 'rec-09', 'rec-10', 'rec-11', 'rec-12', 'rec-13', 'rec-14', 'rec-15', 'rec-16', 'rec-17'
  ];
  const nouvelles = QUESTIONS.filter(q => !VALIDEES.includes(q.id)).length;
  document.getElementById('intro').textContent = (nouvelles
    ? QUESTIONS.length + ' questions, dont ' + nouvelles + ' à relire (badge « À relire »). Bonne(s) réponse(s) en vert (✓). ' +
      'Sous chaque distracteur : l\'explication affichée si l\'élève le choisit. Cochez « OK » ou notez la correction (identifiant de la question + texte corrigé).'
    : 'Les ' + QUESTIONS.length + ' questions du Quiz express sont validées (cochez la case pour les afficher). ') +
    ' Tous les textes (phases 2 à 7) sont relus et validés.';
  function afficher() {
  const voirValidees = document.getElementById('voir-validees').checked;
  let h = '';
  QUESTIONS.forEach((q, n) => {
    const validee = VALIDEES.includes(q.id);
    if (validee && !voirValidees) return;
    const obj = OBJECTIFS.liste.find(o => o.code === q.objectif);
    h += '<div class="q"><div class="tete"><span><b>' + (n + 1) + '. ' + esc(q.id) + '</b> · ' + esc(q.objectif) + ' ' + esc(obj.court) +
      ' <span class="badge ' + (validee ? 'badge-validee">Validée' : 'badge-nouvelle">À relire') + '</span>' +
      '</span><span>' + TYPES[q.type] + ' · difficulté ' + q.difficulte + '</span></div>' +
      '<p class="enonce">' + esc(q.enonce) + '</p>' + MF.figures.rendre(q.figure) + '<ol type="A">';
    q.propositions.forEach((p, i) => {
      const bonne = q.bonnes.includes(i);
      h += '<li><span class="' + (bonne ? 'ok' : '') + '">' + (bonne ? '✓ ' : '') + esc(p) + '</span>' +
        (!bonne && q.erreurs && q.erreurs[i] ? '<br><span class="err">→ ' + esc(q.erreurs[i]) + '</span>' : '') + '</li>';
    });
    h += '</ol><p class="expl"><b>Explication :</b> ' + esc(q.explication) + '</p><p class="src"><b>Source :</b> ' + esc(q.source) + '</p>' +
      '<p class="cases">☐ OK &nbsp;&nbsp; ☐ À corriger : ………………………………………………………………………………</p></div>';
  });
  document.getElementById('liste').innerHTML = h;
  }
  document.getElementById('voir-validees').addEventListener('change', afficher);
  afficher();

  // Phase 4 : textes des modules « Visite du Mac » et « Clavier secret »
  (function () {
    let h = '<h2>Visite du Mac — légende du Bureau (tutoriel, p. 1) <span class="badge badge-validee">Validée</span></h2>' +
      '<table class="relire"><thead><tr><th>Légende</th><th>Consigne « Touchez… »</th><th>Si l\'élève le touche par erreur : « Vous avez touché… »</th><th>Rappel de position (si confondu)</th><th>Explication</th></tr></thead><tbody>';
    BUREAU.elements.forEach(e => {
      h += '<tr><td><b>' + esc(e.lettre) + '. ' + esc(e.nom) + '</b></td><td>' + esc(e.consigne) + '</td><td>' + esc(e.touche) + '</td><td>' + esc(e.ou) + '</td><td>' + esc(e.explication) + '</td></tr>';
    });
    h += '</tbody></table>' +
      '<table class="relire"><tbody>' +
      '<tr><th>Applications du Dock simulé</th><td>' + BUREAU.applications.map(a => esc(a.nom) + ' (' + esc(a.abr) + ')').join(', ') + ' — le Finder est toujours présent et ouvert ; 3 autres sont tirées au hasard.</td></tr>' +
      '<tr><th>Menus affichés</th><td>Finder actif : ' + BUREAU.menusFinder.map(esc).join(', ') + ' (capture du tutoriel) ; autre application : ' + BUREAU.menusAutres.map(esc).join(', ') + '.</td></tr>' +
      '<tr><th>Application active (2 étapes)</th><td>« Quelle est l\'application active ? » — Explication : « L\'application active est celle dont le nom apparaît en gras à côté du menu Pomme : ici, … » — Erreurs : « « X » est ouverte (point sous son icône), mais son nom n\'est pas en gras dans la barre des menus. » ou « « X » n\'est pas ouverte : pas de point sous son icône. »</td></tr>' +
      '<tr><th>Applications ouvertes (2 étapes)</th><td>« Touchez toutes les applications ouvertes, puis « Valider ». » — Explication : « Un petit point sous l\'icône indique qu\'une application est ouverte : ici, … » — Erreurs : « Il manque N application(s) ouverte(s). », « « X » n\'est pas ouverte : pas de point sous son icône. »</td></tr>' +
      '<tr><th>Spotlight (1 étape)</th><td>« Avec Spotlight, ouvrez le Finder. » — L\'élève touche la loupe, écrit, puis touche un résultat parmi : ' +
      BUREAU.spotlight.resultats.map(x => esc(x.nom) + ' (' + esc(x.genre) + ')').join(', ') +
      '. — Explication : « Spotlight s\'ouvre avec la loupe en haut à droite de l\'écran (ou ⌘ Espace) : écrivez « Finder », puis touchez l\'application dans les résultats. » — Réussite : « Le Finder est maintenant l\'application active : son nom apparaît en gras dans la barre des menus. » — S\'il touche le Finder dans le Dock : « Le Finder s\'ouvrirait aussi depuis le Dock, mais ici, utilisez Spotlight. »</td></tr>' +
      '</tbody></table>';
    h += '<h2>Clavier secret — les 20 raccourcis (fiche, formulation exacte) <span class="badge badge-validee">Validée</span></h2>' +
      '<table class="relire"><thead><tr><th>Raccourci</th><th>Texte affiché</th><th>Souvent confondu avec (distracteurs)</th></tr></thead><tbody>';
    const combi = r => r.touches.join(' ') + (r.puis ? ' puis ' + r.puis : '');
    RACCOURCIS.forEach(r => {
      h += '<tr><td><b>' + esc(combi(r)) + '</b></td><td>' + esc(r.action + (r.precision ? ' (' + r.precision + ')' : '')) + '</td><td>' +
        r.proches.map(id => esc(combi(RACCOURCIS.find(x => x.id === id)))).join(', ') + '</td></tr>';
    });
    h += '</tbody></table><p class="src">Messages après une combinaison fausse : « Vous avez composé … : « texte de la fiche ». », puis un indice : « Tous les raccourcis de la fiche commencent par ⌘. », ' +
      '« La touche finale est juste ; vérifiez les touches de modification (⌘, ⇧, ⌥). », « Les touches de modification sont justes ; changez la touche finale. », ' +
      '« Presque : cette capture se fait en deux temps. » ; si l\'élève compose ⌘ Espace : « cette combinaison ouvre Spotlight ».</p>';
    document.getElementById('phase4').innerHTML = h;
  })();

  // Phase 5 : « Le grand rangement »
  (function () {
    const nomDe = id => ATELIER.fichiers.find(f => f.id === id).nom;
    let h = '<h2>Le grand rangement — les 9 missions <span class="badge badge-validee">Validée</span></h2>' +
      '<table class="relire"><thead><tr><th>Mission</th><th>Contexte et consigne</th><th>Indice 1</th><th>Indice 2 (le dernier)</th></tr></thead><tbody>';
    ATELIER.missions.forEach((m, k) => {
      h += '<tr><td><b>' + (k + 1) + '. ' + esc(m.titre) + '</b><br>' + esc(m.objectif) + '</td><td>' + esc(m.contexte) + '<br><b>' + esc(m.consigne) + '</b></td><td>' +
        esc(m.indices[0]) + '</td><td>' + esc(m.indices[1]) + '</td></tr>';
    });
    h += '</tbody></table>' +
      '<h2>Le grand rangement — fichiers fictifs <span class="badge badge-validee">Validée</span></h2>' +
      '<table class="relire"><thead><tr><th>Fichier</th><th>Rangement attendu</th><th>Remarque</th></tr></thead><tbody>';
    ATELIER.fichiers.forEach(f => {
      const dans = ATELIER.archive.contenu.includes(f.id) ? 'dans ' + ATELIER.archive.nom : Object.keys(ATELIER.depart).find(l => ATELIER.depart[l].includes(f.id));
      h += '<tr><td>' + esc(f.nom) + '<br><small>(' + esc(dans) + ')</small></td><td>' + esc(f.categorie || (f.id === 'h1' || f.id === 'n1' ? '1C (mission bonus)' : '—')) + '</td><td>' +
        (f.doublonDe ? 'doublon de « ' + esc(nomDe(f.doublonDe)) + ' »' : '') + (f.aRenommer ? 'nom à rendre explicite (aperçu : ' + esc(f.apercu) + ')' : '') + '</td></tr>';
    });
    h += '</tbody></table><table class="relire"><tbody>' +
      Object.keys(ATELIER.motsCles).map(c => '<tr><th>Mots reconnus (' + esc(c) + ')</th><td>' + ATELIER.motsCles[c].map(esc).join(', ') + ' (sans tenir compte des majuscules ni des accents)</td></tr>').join('') +
      '<tr><th>Libellés « à vérifier » (data/libelles-macos.js)</th><td>' + Object.values(LIBELLES_MACOS.actions).map(esc).join(' · ') + ' — nouveau dossier : « ' + esc(LIBELLES_MACOS.nouveauDossierNom) + ' » — types : ' +
      Object.values(LIBELLES_MACOS.types).map(esc).join(', ') + '</td></tr>' +
      '<tr><th>Messages de la vérification (exemples)</th><td>« Presque : vérifiez les majuscules et les accents de « … ». » · « « … » existe, mais pas au bon endroit : il doit être dans « … ». » · « Plage : il manque 1 fichier. » · « Ville : 1 fichier n\'a rien à faire ici. » · « Il reste 1 doublon dans « Exercice_finder ». » · « Pour 1 fichier, vous avez gardé la copie et jeté l\'original… » · « Plage : une image porte encore un nom automatique. » · « « Montagne » n\'est pas encore compressé. »</td></tr>' +
      '<tr><th>Points et étoiles</th><td>100 points la première fois qu\'une mission est réussie (0 ensuite, pour éviter de « farmer ») ; ★★★ sans indice, ★★ avec un indice, ★ avec le dernier. Aucune pénalité pour une vérification ratée.</td></tr>' +
      '</tbody></table>';
    document.getElementById('phase5').innerHTML = h;
  })();

  // Phase 6 : « Détective du Finder »
  (function () {
    const R = RECHERCHE, M = MF.rechercheModele, auj = new Date();
    const ligne = l => esc(l.critere + ' ' + l.operateur + ' ' + (l.valeur !== undefined ? '« ' + l.valeur + ' »' : l.date ? l.date.split('-').reverse().join('.') : l.nombre + (l.unite ? ' ' + l.unite : '')));
    let h = '<h2>Détective du Finder — les missions <span class="badge badge-validee">Validée</span></h2>' +
      '<table class="relire"><thead><tr><th>Mission</th><th>Consigne et indices</th><th>Recherche(s) acceptée(s) → résultat attendu</th><th>Erreurs typiques refusées</th></tr></thead><tbody>';
    R.missions.forEach((m, k) => {
      const attendu = m.solutions ? M.attendu(m.id, auj).map(e => esc(e.nom)).join(', ') : '';
      h += '<tr><td><b>' + (m.partieA ? 'A' : k) + '. ' + esc(m.titre) + '</b><br>' + esc(m.objectif) + '</td><td><b>' + esc(m.consigne) + '</b><br>1. ' + esc(m.indices[0]) + '<br>2. ' + esc(m.indices[1]) + '</td><td>' +
        (m.solutions ? m.solutions.map(s => s.map(ligne).join(' ET ')).join('<br>ou ') + '<br>→ ' + attendu
          : m.partieA ? R.spotlight.map(s => esc(M.element(s.id).nom)).join(', ')
          : m.photos.map(id => esc(M.element(id).nom) + ' (' + esc(M.element(id).apercu) + ', ' + esc(M.element(id).lieu) + ')').join('<br>')) + '</td><td>' +
        (m.erreurs ? m.erreurs.map(s => s.map(ligne).join(' ET ')).join('<br>') : '') + '</td></tr>';
    });
    h += '</tbody></table><h2>Détective du Finder — fichiers fictifs (' + R.elements.length + ') <span class="badge badge-validee">Validée</span></h2>' +
      '<table class="relire"><thead><tr><th>Nom</th><th>Type</th><th>Dossier</th><th>Modifié</th><th>Auteur</th><th>Pages</th><th>Contenu (mots)</th></tr></thead><tbody>';
    R.elements.forEach(e => {
      h += '<tr><td>' + esc(e.nom) + '</td><td>' + esc(e.type) + '</td><td>' + esc(e.dossier) + '</td><td>' + (e.date ? esc(e.date.split('-').reverse().join('.')) : 'il y a ' + e.jours + ' j') +
        '</td><td>' + esc(e.auteur || '') + '</td><td>' + (e.pages || '') + '</td><td>' + esc((e.mots || []).join(', ')) + (e.lieu ? ' — lieu : ' + esc(e.lieu) : '') + '</td></tr>';
    });
    const LR = LIBELLES_MACOS.recherche;
    h += '</tbody></table><table class="relire"><tbody>' +
      '<tr><th>Libellés « à vérifier »</th><td>' + esc(LR.rechercher) + ' ' + esc(LR.ceMac) + ' · opérateurs : ' + Object.keys(LR.operateurs).map(c => esc(c) + ' → ' + LR.operateurs[c].map(esc).join(' / ')).join(' ; ') + '</td></tr>' +
      '<tr><th>Simplifications</th><td>Pas de champ de recherche libre (seulement les lignes de critères) ; majuscules et accents ignorés dans « contient » ; dans le site, un PDF n\'est pas de type « Document » (à vérifier sur un Mac) ; photos : panneau « Métadonnées de la photo » sans nommer l\'outil de macOS (votre choix 1).</td></tr>' +
      '</tbody></table>';
    document.getElementById('phase6').innerHTML = h;
  })();

  // Phase 7 : badges et examen blanc
  (function () {
    let h = '<h2>Les 8 badges <span class="badge badge-validee">Validée</span></h2><table class="relire"><thead><tr><th>Badge</th><th>Texte affiché (comment l\'obtenir)</th></tr></thead><tbody>' +
      BADGES.map(b => '<tr><td><b>' + esc(b.nom) + '</b></td><td>' + esc(b.description) + '</td></tr>').join('') + '</tbody></table>' +
      '<h2>L\'examen blanc <span class="badge badge-validee">Validée</span></h2><table class="relire"><tbody>' +
      '<tr><th>Ouverture</th><td>Quand chaque activité a été jouée au moins une fois (message : « Jouez d\'abord au moins une fois chaque activité (n sur 5) »).</td></tr>' +
      '<tr><th>Partie 1</th><td>20 questions du Quiz express : une par objectif (19) + une au hasard ; règles habituelles (2 essais, explications).</td></tr>' +
      '<tr><th>Partie 2</th><td>Une mission courte du Grand rangement tirée au hasard : doublons, noms explicites ou compression.</td></tr>' +
      '<tr><th>Partie 3</th><td>Une mission du Détective tirée au hasard parmi les recherches à deux critères (3, 4, 6, 7, 9).</td></tr>' +
      '<tr><th>Note</th><td>Question juste du premier coup = 1 ; mission réussie sans indice = 1, avec indice = 0,5 ; mission passée = 0. Résultat en %, étoiles comme une partie. Pas de chronomètre.</td></tr>' +
      '<tr><th>Bilan</th><td>% par thème ; si le plus faible est sous 80 % : « Révisez en priorité : [thème] (x %) » + bouton « Quiz express : [thème] » et l\'activité correspondante ; sinon « Bravo : tous les thèmes sont à 80 % ou plus. »</td></tr>' +
      '</tbody></table>';
    document.getElementById('phase7').innerHTML = h;
  })();
</script>
</body>
</html>
